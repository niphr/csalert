url: https://niphr.github.io/csalert/

template:
  package: cstemplate
  params:
    hero:
      overline: "R package · Surveillance alerts"
      title: "Alerts from surveillance data."
      lede: >
        Complete the weeks still being reported, then measure trend, intensity
        and alerts on the nowcast draws.
      cta:
        primary:
          text: "Get started"
          href: "articles/csalert.html"
        secondary:
          text: "Browse the reference →"
          href: "reference/index.html"

reference:
  - title: "Ensemble format and naming grammar"
    desc: >
      The ensemble of draws, the reporting-triangle input, and the grammar that
      names their columns.
    contents:
      - csfmt_ensemble_v3
      - validate_ensemble
      - print.csfmt_ensemble_v3
      - csfmt_reporting_triangle_v3
      - reporting_triangle_matrix
      - isoyearweek_week_start
      - set_time_series_id
      - csfmt_var
      - csfmt_parse
      - csfmt_interpret
      - q_label
      - q_value

  - title: "Nowcast engines"
    desc: "Complete the weeks of a reporting triangle that are still being reported."
    contents:
      - nowcast_delay_ecdf_v1
      - nowcast_passthrough_to_ensemble_v1

  - title: "Ensemble stages"
    desc: >
      Stages that take an ensemble and return it with new columns, and the
      collapse to quantiles that ends the pipeline.
    contents:
      - ens_add_rate
      - short_term_trend
      - mem_thresholds_v1
      - signal_detection_hlm
      - ens_collapse

  - title: "Nowcast diagnostics"
    desc: >
      Replay a method on past dates and score it, and measure how fast counts
      arrive.
    contents:
      - nowcast_censor
      - nowcast_truth
      - nowcast_backtest
      - nowcast_evaluate_v1
      - reporting_completion_v1
      - reporting_completion_trend_v1

  - title: "Nowcast calibration"
    desc: >
      Measure how far the intervals of an engine are from nominal coverage, as
      a factor per horizon. The package does not apply it unless you choose to.
    contents:
      - nowcast_estimate_calibration_v1
      - nowcast_apply_calibration_v1
      - print.nowcast_calibration

  - title: "Quality control"
    desc: "Check one input feed, and compare two runs of the pipeline."
    contents:
      - qc_surveillance_data_v1
      - qc_week_over_week_v1
      - compare_results

  - title: "Trend helpers"
    desc: "The rolling-slope kernel, and the trend alarm for a surveillance sts object."
    contents:
      - rolling_slope_matrix
      - short_term_trend_sts_v1

  - title: "Data simulation"
    desc: "Simulate daily counts with known outbreaks and holiday effects."
    contents:
      - simulate_baseline_data
      - simulate_seasonal_outbreak_data
      - simulate_spike_outbreak_data
      - add_holiday_effect

authors:
  footer:
    roles: [cre, aut]
    text: "Crafted by"
  sidebar:
    roles: [cre, aut, cph]
  before: "This package is proudly brought to you by:"
  after: "See the [changelog](news/index.html) for other contributors. :pray:"
  Richard Aubrey White:
    href: "https://www.rwhite.no"
